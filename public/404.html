<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#075cff">
  <title>Página não encontrada | Bruno Teixeira — Vibra Soluções</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f1f1f1;color:#001c46;font-family:Arial,Helvetica,sans-serif}
    .top{height:68px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 max(24px,8vw)}
    .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#001c46}
    .brand img{width:38px;height:38px;object-fit:contain}
    .brand span{display:flex;flex-direction:column}
    .brand b{font-size:14px}
    .brand small{font-size:10px;color:#075cff;font-weight:700}
    .wrap{min-height:calc(100vh - 68px);display:grid;grid-template-columns:1.05fr .95fr}
    .copy{padding:clamp(50px,8vw,110px);display:flex;flex-direction:column;justify-content:center}
    .eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;color:#075cff}
    h1{font-size:clamp(58px,9vw,128px);line-height:.86;margin:26px 0 34px;letter-spacing:-.05em}
    p{max-width:620px;font-size:17px;line-height:1.65;color:#51617b;margin:0 0 34px}
    .btn{display:inline-flex;width:max-content;background:#075cff;color:#fff;text-decoration:none;padding:16px 24px;font-size:12px;font-weight:700}
    .visual{background:#001f4d;display:flex;align-items:center;justify-content:center;padding:50px}
    .visual img{width:min(330px,75%);filter:brightness(0) invert(1);opacity:.96}
    @media(max-width:780px){.wrap{grid-template-columns:1fr}.visual{min-height:260px;order:-1}.copy{padding:50px 24px 70px}h1{font-size:64px}}
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">
      <img src="/assets/brand.png" alt="Vibra Soluções">
      <span><b>Bruno Teixeira</b><small>VIBRA SOLUÇÕES</small></span>
    </a>
  </header>
  <main class="wrap">
    <section class="copy">
      <span class="eyebrow">/ ERRO 404</span>
      <h1>Essa página<br>não existe.</h1>
      <p>O endereço acessado não foi encontrado. Volte para o biosite de Bruno Teixeira e continue navegando pelas soluções da Vibra.</p>
      <a class="btn" href="/">VOLTAR PARA O SITE</a>
    </section>
    <aside class="visual">
      <img src="/assets/brand.png" alt="Vibra Soluções">
    </aside>
  </main>
</body>
</html>
